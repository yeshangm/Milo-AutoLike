
name: Build Milo AutoLike APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract project
        run: |
          mkdir source
          unzip -q *.zip -d source
          find source -name settings.gradle -o -name settings.gradle.kts

      - name: Build APK
        run: |
          PROJECT_FILE=$(find source -name settings.gradle -o -name settings.gradle.kts | head -n 1)
          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          cd "$PROJECT_DIR"
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Milo-AutoLike-APK
          path: "source/**/build/outputs/apk/debug/*.apk"
